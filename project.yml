name: SnookerTracker
options:
  bundleIdPrefix: com.melman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SnookerTracker:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 8V5TQR6N9X
    CODE_SIGN_STYLE: Automatic
targets:
  SnookerTracker:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: SnookerTracker
        product: AppComposition
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Snooker
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melman.snookertracker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
